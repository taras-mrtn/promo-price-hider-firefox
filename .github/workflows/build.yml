name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version change
        id: version
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          if git show HEAD~1:manifest.json >/dev/null 2>&1; then
            PREV=$(git show HEAD~1:manifest.json | jq -r .version)
          else
            PREV=""
          fi
          if [ "$VERSION" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g web-ext

      - run: web-ext lint

      - run: web-ext build

      - uses: actions/upload-artifact@v4
        with:
          name: promo-price-hider
          path: web-ext-artifacts/*.zip

      - name: Copy as xpi
        if: steps.version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: cp web-ext-artifacts/*.zip web-ext-artifacts/promo-price-hider.xpi

      - name: Generate release notes from commits since the previous tag
        if: steps.version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' "$RANGE"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.version.outputs.current }}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        if: steps.version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body_path: release-notes.md
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/promo-price-hider.xpi
